name: Kuma compatibility

on:
  push:
    branches: [main, fletchto99/kuma-managed-hosting]
    paths: [Dockerfile, .dockerignore, .github/workflows/compatibility.yml, "tests/**", "scripts/**", "infra/**"]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/compatibility.yml, "tests/**", "scripts/**", "infra/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate scripts
        run: |
          bash -n tests/compatibility.sh
          node --check tests/mysql-tls.cjs
          node --check tests/configuration.cjs
          node --check scripts/patch-database-tls.cjs
          shellcheck tests/compatibility.sh
      - name: Test patched release with synthetic MySQL and TLS certificates
        run: bash tests/compatibility.sh
      - name: Report failed compatibility gate
        if: failure()
        run: |
          echo "::error::Compatibility gate failed. Do not provision or deploy this candidate."
          echo "Deployment remains blocked. Inspect the synthetic compatibility results above." >> "$GITHUB_STEP_SUMMARY"
