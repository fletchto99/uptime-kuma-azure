name: Controlled Dependabot merge
on:
  workflow_run:
    workflows: ["Kuma compatibility"]
    types: [completed]
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: controlled-dependabot-merge
  cancel-in-progress: false
jobs:
  merge:
    if: github.repository == 'fletchto99/uptime-kuma-azure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Merge only a verified eligible update and explicitly dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_CONTROLLED_UPDATES: ${{ vars.ENABLE_CONTROLLED_UPDATES }}
        run: node scripts/merge-dependabot.cjs
