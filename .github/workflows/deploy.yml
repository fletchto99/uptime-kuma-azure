name: Controlled Kuma update
on:
  workflow_run:
    workflows: ["Kuma compatibility"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only authorization/recovery verification, same-image restart, or tested main release
        required: true
        default: verify
        type: choice
        options: [verify, noop, release]
      expected_sha:
        description: Optional expected current main SHA for manual dispatch
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-singleton
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'fletchto99/uptime-kuma-azure' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && vars.ENABLE_CONTROLLED_UPDATES == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      operation: ${{ steps.gate.outputs.operation }}
      expected_sha: ${{ steps.gate.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current main and an explicitly enabled release policy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ENABLE_CONTROLLED_UPDATES: ${{ vars.ENABLE_CONTROLLED_UPDATES }}
        run: node scripts/release-gate.cjs
  validate:
    needs: gate
    if: needs.gate.outputs.operation == 'release'
    uses: ./.github/workflows/compatibility.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
  deploy:
    needs: [gate, validate]
    if: always() && !cancelled() && needs.gate.result == 'success' && (needs.gate.outputs.operation != 'release' || needs.validate.result == 'success')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_MYSQL_SERVER_NAME: ${{ secrets.AZURE_MYSQL_SERVER_NAME }}
      AZURE_FEDERATED_SUBJECT: ${{ secrets.AZURE_FEDERATED_SUBJECT }}
      AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
      GH_TOKEN: ${{ github.token }}
      UPDATE_OPERATION: ${{ needs.gate.outputs.operation }}
      EXPECTED_SHA: ${{ needs.gate.outputs.expected_sha }}
      RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require masked environment identifiers
        run: |
          test -n "$AZURE_CLIENT_ID" && test -n "$AZURE_TENANT_ID" && test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_RESOURCE_GROUP" && test -n "$AZURE_WEBAPP_NAME" && test -n "$AZURE_MYSQL_SERVER_NAME"
          echo "DEPLOYMENT_FAILURE_FILE=$RUNNER_TEMP/deployment-failure.json" >> "$GITHUB_ENV"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        id: azure_login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify scoped reads and native recovery metadata
        id: recovery
        run: node scripts/recovery-gate.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-metadata
          path: ${{ runner.temp }}/recovery.json
          retention-days: 30
          if-no-files-found: error
      - name: Stop, update the exact digest, start and verify
        if: env.UPDATE_OPERATION != 'verify'
        env:
          DEPLOYMENT_APPROVED: "true"
          BACKUPS_VERIFIED: ${{ steps.recovery.outputs.verified }}
          IMAGE: ${{ steps.recovery.outputs.image }}
          REQUIRE_CURRENT_MAIN: "true"
        run: bash scripts/deploy.sh
      - name: Report an actual deployment failure independently of Kuma
        if: failure()
        run: node scripts/deployment-failure.cjs
      - name: Close the Azure login
        if: always() && steps.azure_login.outcome == 'success'
        run: az logout
